services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5433:5432"
    volumes:
      - ./services/auditor/data/test_init.sql:/docker-entrypoint-initdb.d/01-test_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 2s
      timeout: 5s
      retries: 3

  tools:
    build:
      context: ./services/auditor
      target: tools
    working_dir: /workspace/services/auditor
    volumes:
      - .:/workspace

  test-runner:
    image: golang:1.27.1
    working_dir: /workspace/services/auditor
    volumes:
      - .:/workspace
      - ./services/auditor/sqlboiler.docker.toml:/workspace/services/auditor/sqlboiler.toml:ro
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: myapp
    depends_on:
      postgres:
        condition: service_healthy
