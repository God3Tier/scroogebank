name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

# Read-only by default; a job that needs more sets its own permissions.
permissions:
  contents: read

jobs:
  backend:
    name: Build & test backend services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs the full reactor: every module listed in the root pom.xml.
      # Testcontainers works out of the box here since GitHub-hosted
      # ubuntu-latest runners ship Docker natively (unlike local Docker
      # Desktop on Windows, which needs the npipe workaround documented in
      # each service's README).
      - name: Build and test
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "services/*/target/surefire-reports/**"

  grpc-contract:
    name: Check the gRPC contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The breaking-change check reads the base branch from git history.
          fetch-depth: 0

      - name: Lint proto/
        run: docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:1.73.0 lint

      # Pull requests only: compare with the branch the change would merge
      # into (ADR-0021). Skipped while that branch has no buf.yaml, so the
      # change that adds the contracts can pass.
      - name: Check proto/ for breaking changes
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "$base:buf.yaml" 2>/dev/null; then
            docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:1.73.0 \
              breaking --against ".git#ref=$base"
          else
            echo "$base has no buf.yaml yet; nothing to compare against."
          fi

  # The OpenAPI contracts in docs/api (ADR-0063). Each service's own tests
  # check its responses against them; this job checks the files themselves.
  openapi-contract:
    name: Check the OpenAPI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The breaking-change check reads the base branch from git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate docs/api
        run: |
          pip install openapi-spec-validator==0.9.0
          for spec in docs/api/*.yaml; do
            openapi-spec-validator "$spec"
          done

      # Pull requests only: compare with the branch the change would merge
      # into, as buf breaking does for the gRPC contracts.
      - name: Check docs/api for breaking changes
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-openapi-breaking.sh "origin/${{ github.base_ref }}"

  # One job per Go service. Each runs the service's own `make test`, which
  # starts a disposable PostgreSQL (and LocalStack where a test needs it) and
  # generates the git-ignored ORM, mocks and gRPC code first, so CI and a local
  # run do the same thing.
  go:
    name: Test Go service (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auditor
            make-dir: services/auditor
            go-mod: services/auditor/go.mod
            modules: services/auditor
          - name: client-profile-management-service
            make-dir: services/client-profile-management-service
            go-mod: services/client-profile-management-service/go.mod
            modules: services/client-profile-management-service
          - name: account-service
            make-dir: services/account-service
            go-mod: services/account-service/go.mod
            modules: services/account-service
          - name: sftp
            make-dir: services/sftp
            go-mod: services/sftp/receiver/go.mod
            modules: services/sftp/receiver services/sftp/producer
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go-mod }}
          cache-dependency-path: ${{ matrix.make-dir }}/**/go.sum

      # Committed code only: generated code is git-ignored and not checked.
      - name: Check formatting
        run: |
          unformatted=$(for dir in ${{ matrix.modules }}; do git ls-files -z "$dir/*.go"; done | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run the service's test loop
        run: make -C ${{ matrix.make-dir }} test

      # Uses the code generated by the test loop. The ORM and gRPC code are
      # generated, so they are not vetted.
      - name: Vet
        run: |
          for dir in ${{ matrix.modules }}; do
            (cd "$dir" && go list ./... | grep -v -e /repository/orm -e /src/gen | xargs go vet)
          done

      # CodeQL for Go runs here rather than in the codeql job because it needs
      # the code the test loop generated, as Vet does. It extracts what the
      # traced `go build` compiles.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build for CodeQL
        run: |
          for dir in ${{ matrix.modules }}; do
            (cd "$dir" && go build ./...)
          done

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Fail on CodeQL alerts
        run: bash .github/scripts/check-codeql-results.sh codeql-results

      - name: Upload the CodeQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-go-${{ matrix.name }}
          path: codeql-results
          if-no-files-found: ignore

  # Static analysis for security bugs (ADR-0028). The repository has no GitHub
  # Code Security, so results are not uploaded to code scanning: the job fails
  # on any alert, shows each one as an annotation and keeps the SARIF report as
  # an artifact. Go is scanned in the go job.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL extracts only the Java sources that this build compiles.
      - name: Build for CodeQL
        if: matrix.build-mode == 'manual'
        run: mvn -B -DskipTests compile

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Fail on CodeQL alerts
        run: bash .github/scripts/check-codeql-results.sh codeql-results

      - name: Upload the CodeQL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: ignore

  # Dependency scanning (ADR-0028). OSV-Scanner fails on any known
  # vulnerability in a dependency, except those accepted in osv-scanner.toml,
  # each with a reason and an expiry date.
  dependencies:
    name: Scan dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go call analysis is off: it compiles each service, which needs the
      # generated code that only the go job builds. Python resolution is off
      # because it ignores botocore's python_version markers and rejects
      # urllib3 2.x; the search spike pins every package instead.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --config=./osv-scanner.toml
            --no-call-analysis=go
            --experimental-disable-plugins=transitivedependency/requirements
            --recursive
            ./

  frontend:
    name: Lint, test and build the frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
