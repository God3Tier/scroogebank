name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

jobs:
  backend:
    name: Build & test backend services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs the full reactor: every module listed in the root pom.xml.
      # Testcontainers works out of the box here since GitHub-hosted
      # ubuntu-latest runners ship Docker natively (unlike local Docker
      # Desktop on Windows, which needs the npipe workaround documented in
      # each service's README).
      - name: Build and test
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "services/*/target/surefire-reports/**"
