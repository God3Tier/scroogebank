name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

jobs:
  backend:
    name: Build & test backend services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Runs the full reactor: every module listed in the root pom.xml.
      # Testcontainers works out of the box here since GitHub-hosted
      # ubuntu-latest runners ship Docker natively (unlike local Docker
      # Desktop on Windows, which needs the npipe workaround documented in
      # each service's README).
      - name: Build and test
        run: mvn -B verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "services/*/target/surefire-reports/**"

  event-alert-auditor-contract:
    name: Test event-alert auditor contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable auditor database
        run: docker compose -f docker-compose.test.yml -p auditor-ci up -d --wait postgres

      - name: Generate ignored SQLBoiler models
        run: >-
          docker compose -f docker-compose.test.yml -p auditor-ci run --rm -T tools
          sqlboiler -c sqlboiler.toml psql -o src/internal/repository/orm --wipe

      - name: Test Kafka validation and audit deduplication
        run: >-
          docker compose -f docker-compose.test.yml -p auditor-ci run --rm -T test-runner
          go test ./src/serverd/kafka ./src/internal/repository/audit

      - name: Stop disposable auditor database
        if: always()
        run: docker compose -f docker-compose.test.yml -p auditor-ci down -v --remove-orphans
