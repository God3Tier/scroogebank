syntax = "proto3";

// The auditor's read API (ADR-0021). The auditor serves it; other CRM
// services call it over the internal network, never through API Gateway.
//
// Change it additively only: add fields and RPCs with new numbers, never
// renumber, reuse or remove one. CI runs buf breaking against the base branch.
package audit.v1;

import "google/protobuf/timestamp.proto";

option go_package = "auditor/src/gen/audit/v1;auditv1";
option java_multiple_files = true;
option java_package = "bank.audit.grpc.v1";

// AuditService reads the hash-chained audit log.
service AuditService {
  // ListActivities returns changes made by CRM users, newest first: the
  // entries of the activity feed. The caller's token decides what it may
  // see: an admin any actor, an agent only their own entries.
  rpc ListActivities(ListActivitiesRequest) returns (ListActivitiesResponse);
}

message ListActivitiesRequest {
  // Only entries by this actor, a Cognito sub. Empty means every actor,
  // which only an admin may ask for.
  string actor_id = 1;
  // Inclusive lower bound. Unset means no lower bound.
  google.protobuf.Timestamp from = 2;
  // Exclusive upper bound. Unset means no upper bound.
  google.protobuf.Timestamp to = 3;
  // 1 to 100.
  int32 page_size = 4;
  // A previous response's next_page_token. Empty starts at the newest entry.
  string page_token = 5;
  // Only events whose audited payload names this client. Empty means any client.
  string client_id = 6;
}

message ListActivitiesResponse {
  // Newest first.
  repeated Activity activities = 1;
  // Pass as page_token to get the next page. Empty means no more pages.
  string next_page_token = 2;
}

// Activity is one audit entry as the feed shows it.
message Activity {
  string id = 1;
  // The producing service, for example USER_MANAGEMENT or CRM.
  string source_service = 2;
  string action = 3;
  // The acting user's Cognito sub.
  string actor_id = 4;
  google.protobuf.Timestamp timestamp = 5;
  // The event's JSON payload. It never holds client personal data.
  string payload = 6;
}
