openapi: 3.0.3
info:
  title: Event-alert service - current holdings and agent events
  version: 1.0.0
  description: >
    Routes added by ADR-0066. Present only when ALERT_HOLDINGS_MODE=database (portfolios)
    or always (agent events). Synthetic project data only. Recording holdings never places a
    trade, and INFORM_CLIENT never contacts a client. The existing per-alert routes are in
    event-driven-alerts-contracts.md. A test (OpenApiContractTest) fails if a path or method
    here differs from the controllers.
security:
  - cognitoAccessToken: []
paths:
  /api/alert-portfolios/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Current recorded portfolio of a CRM account (owning agent, or admin read-only)
      responses:
        '200': { description: Portfolio, content: { application/json: { schema: { $ref: '#/components/schemas/Portfolio' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    put:
      summary: Atomically replace the complete portfolio (current agent only)
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioReplaceRequest' } } }
      responses:
        '200': { description: Stored portfolio, content: { application/json: { schema: { $ref: '#/components/schemas/Portfolio' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Stale revision, reused key with another body, or the account cannot hold positions, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: Unknown or duplicate instrument, bad number, future valuedAt, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /api/alerts/events:
    get:
      summary: One card per public event for the signed-in agent
      parameters:
        - { name: onlyOpen, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Event cards, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
        '503': { $ref: '#/components/responses/Problem' }
  /api/alerts/events/{eventId}:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: The card, the agent's affected clients and the latest action
      responses:
        '200': { description: Event detail, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/alerts/events/{eventId}/actions:
    parameters:
      - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Apply Inform / Monitor / Dismiss to an explicit set of the agent's clients
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' } }
        - { name: X-Correlation-Id, in: header, required: false, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ActionRequest' } } }
      responses:
        '200': { description: Per-member outcomes, content: { application/json: { schema: { $ref: '#/components/schemas/ActionResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cognitoAccessToken: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties: { type: { type: string }, title: { type: string }, status: { type: integer }, detail: { type: string }, correlationId: { type: string, format: uuid } }
    Position:
      type: object
      required: [instrumentId, quantity, unitPrice, valuationCurrency, fxToSgd, valuedAt]
      properties:
        instrumentId: { type: string, maxLength: 32 }
        quantity: { type: number }
        unitPrice: { type: number }
        valuationCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        fxToSgd: { type: number }
        valuedAt: { type: string, format: date-time }
    PortfolioReplaceRequest:
      type: object
      required: [expectedRevision, sourceLabel, positions]
      properties:
        expectedRevision: { type: integer, minimum: 0, description: 0 for the first save }
        sourceLabel: { type: string, maxLength: 64 }
        positions: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Position' } }
    Portfolio:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        clientId: { type: string, format: uuid }
        revision: { type: integer }
        sourceLabel: { type: string }
        updatedAt: { type: string, format: date-time }
        totalSgd: { type: number }
        positions:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Position'
              - type: object
                properties:
                  ticker: { type: string }
                  issuerName: { type: string }
                  valueSgd: { type: number }
                  freshness: { type: string, enum: [FRESH, STALE, EXPIRED, MISSING] }
    Evidence:
      type: object
      properties: { title: { type: string }, url: { type: string }, sourceDomain: { type: string }, publishedAt: { type: string, format: date-time }, retrievedAt: { type: string, format: date-time } }
    EventCard:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        headline: { type: string }
        summary: { type: string }
        aiGenerated: { type: boolean }
        uncertainty: { type: string }
        evidence: { $ref: '#/components/schemas/Evidence' }
        affectedClientCount: { type: integer }
        openClientCount: { type: integer }
        topScore: { type: number }
        latestAlertAt: { type: string, format: date-time }
    EventPage:
      type: object
      properties: { items: { type: array, items: { $ref: '#/components/schemas/EventCard' } } }
    AffectedClient:
      type: object
      properties:
        alertId: { type: string, format: uuid }
        clientRef: { type: string }
        instrumentId: { type: string }
        status: { type: string, enum: [NEW, MONITORING, INFORMED, DISMISSED] }
        score: { type: number }
        portfolioPercentage: { type: number }
        amountSgd: { type: string }
        version: { type: integer }
    EventDetail:
      type: object
      properties:
        card: { $ref: '#/components/schemas/EventCard' }
        clients: { type: array, items: { $ref: '#/components/schemas/AffectedClient' } }
        latestAction: { $ref: '#/components/schemas/ActionResult', nullable: true }
    ActionRequest:
      type: object
      required: [decision, members]
      properties:
        decision: { type: string, enum: [INFORM_CLIENT, MONITOR, DISMISS] }
        note: { type: string, maxLength: 500, nullable: true }
        members:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [alertId, expectedVersion]
            properties: { alertId: { type: string, format: uuid }, expectedVersion: { type: integer, minimum: 0 } }
    ActionResult:
      type: object
      properties:
        actionId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        decision: { type: string, enum: [INFORM_CLIENT, MONITOR, DISMISS] }
        recordedAt: { type: string, format: date-time }
        members:
          type: array
          items:
            type: object
            properties:
              alertId: { type: string, format: uuid }
              outcome: { type: string, enum: [APPLIED, STALE_VERSION, INVALID_TRANSITION, NOT_AUTHORISED] }
              previousStatus: { type: string, nullable: true }
              newStatus: { type: string, nullable: true }
