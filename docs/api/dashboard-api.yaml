openapi: 3.0.3

# The API dashboard-service serves. This file is the source of truth for the
# contract; the service also publishes a generated spec at /v3/api-docs when
# the `local` profile is active, and the two must agree.
#
# Every endpoint is a GET. The dashboard never mutates CRM state.

info:
  title: Scrooge CRM - Business Dashboard
  description: |
    Role-shaped business metrics composed from the services that own the data.

    Two properties of this API are deliberate and worth reading before
    integrating:

    **Partial results are normal, not errors.** Every response carries a
    `panels` map, and each panel reports its own `status`. A panel whose
    upstream service is down or not wired up reports `UNAVAILABLE` while the
    rest return data. The HTTP status stays 200
    whenever the caller is authorised and at least one panel resolved. Clients
    must render per-panel status rather than assuming a 200 means every figure is
    present.

    **Figures are eventually consistent.** Responses are cached for up to 3
    minutes per task (ADR-0033), so `generatedAt` is authoritative for when the
    numbers were computed. There is no read-your-writes guarantee. A response
    with an `upstream_timeout` or `upstream_error` panel is not cached, so
    asking again retries the upstreams.

    **What each figure means** is fixed in ADR-0038. Panel `data` is the
    owning service's answer from `docs/api/dashboard-aggregates.yaml`, except
    where an endpoint below says the dashboard derives it.
  version: v1

servers:
  - url: /
    description: Reached through CloudFront's /api/* behaviour, never directly.

tags:
  - name: dashboard
    description: Read-only business metrics.

paths:
  /api/dashboard/overview:
    get:
      tags: [dashboard]
      summary: Headline KPI tiles, shaped by the caller's role
      description: |
        Bank-wide for an admin; scoped to the caller's own clients for an
        agent. The `agents` panel is present only for admins.
      operationId: getOverview
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: |
            Panels are `clients`, `accounts`, `transactions`, and then:

            - for admins, `agents`: `{"total", "active"}`, the number of
              agents and how many are enabled;
            - for agents, `teamComparison`: their clients onboarded against
              the team median, as client-service's
              `/aggregates/clients/team-comparison` returns it. Only for the
              last 7, 30 or 90 days ending today; any other window makes the
              panel `UNAVAILABLE` with `unsupported_window`. `teamMedian` is
              null when fewer than 5 agents are compared (ADR-0038).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AllUpstreamsDown' }

  /api/dashboard/portfolio:
    get:
      tags: [dashboard]
      summary: Composition breakdowns for clients and accounts
      operationId: getPortfolio
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: |
            Panels are `clients`, `accounts`, and `accountsPerClient`
            (`{"ratio"}`, accounts divided by clients; null with no clients).
            `accountsPerClient` is unavailable whenever either of the others is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AllUpstreamsDown' }

  /api/dashboard/transactions:
    get:
      tags: [dashboard]
      summary: Transaction health and daily series
      description: |
        Counts by status and type, value, the pending backlog and a daily
        series. Admins' figures also count unmatched transactions. How fresh
        the import is is not reported yet (ADR-0038).
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Panel is `transactions`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AllUpstreamsDown' }

  /api/dashboard/action-items:
    get:
      tags: [dashboard]
      summary: The caller's work queue
      description: |
        For an agent, the clients they should act on. For an admin, the same
        view bank-wide. Each entry carries a client identifier the caller is
        already permitted to see.
      operationId: getActionItems
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: staleDays
          in: query
          description: |
            Age in days above which an unverified client is considered stale.
            Measured against today, not against the reporting window: this is a
            work queue, so what matters is what is overdue now.

            The ceiling is deliberately generous. A higher value matches fewer
            rows, not more, so it costs the upstream nothing -- unlike the
            window, whose limit bounds how much a query must aggregate. The
            bound exists only to keep the value sane in downstream date
            arithmetic, so it permits any question a real CRM would ask,
            including multi-year data hygiene.
          required: false
          schema: { type: integer, minimum: 1, maximum: 3650, default: 7 }
      responses:
        '200':
          description: |
            Panels are `clients` (stale unverified clients, oldest first) and
            `transactions` (for the pending backlog).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AllUpstreamsDown' }

  /api/dashboard/agents:
    get:
      tags: [dashboard]
      summary: Per-agent performance table (admin only)
      description: |
        Ranks named employees by an explicit metric. Admin-only, and every view
        is audited. No composite score or rating is computed — see ADR-0038.

        The `agents` panel's data is `{"rows", "sortedBy", "currency"}`. Each
        row joins user-service's roster to the client and account figures by
        Cognito sub: `agentId`, `name` and `enabled` (null for a sub not on the
        agent roster), `clientsOnboarded`, `verified`, `unverified`,
        `verificationRate` (null with no clients), `accountsOpened` and
        `bookedInitialDeposits`. Every enabled agent appears; a disabled agent
        appears only with figures in the window.
      operationId: getAgentPerformance
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: sort
          in: query
          description: |
            The metric to order by, highest first. Always an explicit metric,
            never a derived rank (ADR-0038).

            `bookedInitialDeposits` is well defined only because the deployment
            is single-currency by specification — Appendix 2 gives the account
            currency as "SGD for Singapore Dollar" and NFR 12 scopes an
            instance to one legal entity. If the window's accounts use more
            than one currency, the panel is unavailable with
            `mixed_currencies`. See ADR-0038.
          required: false
          schema:
            type: string
            enum: [clientsOnboarded, verificationRate, accountsOpened, bookedInitialDeposits]
            default: clientsOnboarded
      responses:
        '200':
          description: Panel is `agents`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/BadWindow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is an agent. This endpoint is admin-only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/AllUpstreamsDown' }

components:

  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token. Validated at API Gateway and again by this service.

  parameters:
    From:
      name: from
      in: query
      description: Start of the reporting window, inclusive, as a Singapore date. Defaults to 30 days before `to`, counting both ends.
      required: false
      schema: { type: string, format: date }
      example: '2026-08-21'
    To:
      name: to
      in: query
      description: End of the reporting window, inclusive. Defaults to today's date in Singapore.
      required: false
      schema: { type: string, format: date }
      example: '2026-09-20'

  responses:
    BadWindow:
      description: |
        A parameter is invalid. Either the window — `from` after `to`, an
        unparseable date, or a span longer than 365 days — or a parameter
        outside the schema above, such as a `sort` metric that is not in the
        enum or a `staleDays` outside 1..3650. No upstream call is made.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, expired or invalid token. Normally returned by API Gateway's authorizer before this service is reached.
    AllUpstreamsDown:
      description: |
        Every panel failed. Returned only when nothing could be resolved; a
        partial result is a 200 with per-panel statuses.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DashboardResponse' }

  schemas:

    DashboardResponse:
      type: object
      required: [generatedAt, window, scope, panels]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: |
            When these figures were computed — not when the request was
            served. Up to 3 minutes earlier on a cache hit (ADR-0033).
          example: '2026-09-20T06:10:00Z'
        window:
          $ref: '#/components/schemas/Window'
        scope:
          type: string
          enum: [ADMIN, AGENT]
          description: |
            How the figures were scoped. `AGENT` means every number covers
            only the caller's own clients. Derived from the token, never from
            a request parameter.
        panels:
          type: object
          description: Keyed by panel name. Which keys appear depends on the endpoint and the caller's role.
          additionalProperties:
            $ref: '#/components/schemas/Panel'

    Panel:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OK, UNAVAILABLE]
          description: |
            `OK` — fully resolved.
            `UNAVAILABLE` — not resolved; `data` is null and `reason` explains why.

            Two states, not three. A panel is resolved by a single upstream
            call, so it either has its figures or it does not. A *response* can
            still be partial — some panels OK, others not — and that is visible
            in the panel map without a status of its own.
        data:
          type: object
          nullable: true
          description: Panel-specific figures. Null when `status` is `UNAVAILABLE`.
        reason:
          type: string
          nullable: true
          description: |
            Machine-readable cause, present only when the panel did not fully
            resolve. `upstream_not_deployed`: no base URL is configured for the
            service. `upstream_forbidden`: the service refused the caller.
            `mixed_currencies`: the accounts opened in the window use more than
            one currency, so their deposits are not added up (ADR-0038).
            `unsupported_window`: the team comparison covers only the last 7,
            30 or 90 days ending today.
          enum: [upstream_not_deployed, upstream_timeout, upstream_error, upstream_forbidden, mixed_currencies, unsupported_window]

    Window:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date, example: '2026-08-21' }
        to: { type: string, format: date, example: '2026-09-20' }

    Problem:
      type: object
      description: Error body, matching the shape the other CRM services return.
      properties:
        status: { type: integer, example: 400 }
        error: { type: string, example: 'Bad Request' }
        message: { type: string, example: "'from' must not be after 'to'" }
        timestamp: { type: string, format: date-time }

security:
  - bearer-jwt: []
