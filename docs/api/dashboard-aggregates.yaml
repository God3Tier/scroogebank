openapi: 3.0.3

# The figures the business dashboard fetches from the services that own the
# data (ADR-0033). Each service computes its own figures in its own database,
# and scopes them by the caller's verified token: dashboard-service forwards
# the caller's JWT and adds no authority of its own (ADR-0039).
#
# Every route is under /aggregates, outside /api, so API Gateway never routes
# it; dashboard-service reaches the services over Service Connect. The owning
# services do not audit these routes: the dashboard's DASHBOARD_VIEW event is
# the record of each view.
#
# What each figure means is fixed in ADR-0038 and not restated here.

info:
  title: Scrooge CRM - Dashboard aggregate endpoints
  version: v1
  description: |
    Read-only figures for the business dashboard.

    **Scope.** Admins get every row; an agent gets the clients they created,
    the accounts they own and the matched transactions on those accounts. No
    endpoint takes an agent ID. Deleted clients and accounts are never counted.

    **Windows.** `from` and `to` are dates (`YYYY-MM-DD`), both included, in
    Singapore days. Every service refuses a window that runs backwards or spans
    more than 366 days.

    **Amounts** are decimal strings with two places, so no precision is lost.

tags:
  - name: clients
    description: client-profile-management-service (Go)
  - name: accounts
    description: account-service (Go)
  - name: transactions
    description: user-service (Java) in front of the SFTP receiver (Go)

paths:
  /aggregates/clients/stats:
    get:
      tags: [clients]
      summary: Client figures
      operationId: getClientStats
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/GroupBy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /aggregates/clients/action-items:
    get:
      tags: [clients]
      summary: The caller's stale unverified clients, oldest first
      operationId: getClientActionItems
      security: [{ bearerAuth: [] }]
      parameters:
        - name: staleDays
          in: query
          description: Clients still not verified this many days after they were created.
          schema: { type: integer, minimum: 1, maximum: 3650, default: 7 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientActionItems' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /aggregates/clients/team-comparison:
    get:
      tags: [clients]
      summary: The caller's clients onboarded against the team median
      description: |
        Computed here so no other agent's figure leaves the service
        (ADR-0038). The group is every agent with a client, not deleted,
        created in the last 12 months; members with none in the window count
        as zero. The median is null when the group has fewer than 5 agents.
        Only the last 7, 30 or 90 days, ending today in Singapore, are
        offered, so medians over chosen windows cannot be compared.
      operationId: getTeamComparison
      security: [{ bearerAuth: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /aggregates/accounts/stats:
    get:
      tags: [accounts]
      summary: Account figures
      operationId: getAccountStats
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/GroupBy'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Accounts opened in the window use more than one currency, so their
            deposits are not added into one figure (ADR-0038).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aggregates/accounts/ids:
    get:
      tags: [accounts]
      summary: The IDs of the accounts the caller owns
      description: |
        Used by user-service to scope an agent's transaction figures. Returns
        the accounts whose owner is the caller, whatever their role; deleted
        accounts are left out.
      operationId: getOwnedAccountIds
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accountIds]
                properties:
                  accountIds:
                    type: array
                    items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /aggregates/transactions/stats:
    get:
      tags: [transactions]
      summary: Transaction figures (user-service)
      description: |
        For an admin, every transaction in the window. For an agent,
        user-service asks account-service for the caller's account IDs and
        passes only those to the receiver. The caller's token never reaches
        the receiver.
      operationId: getTransactionStats
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: account-service answered without an account list.
    post:
      tags: [transactions]
      summary: Transaction figures (SFTP receiver, private)
      description: |
        Served by the receiver, which has no authentication of its own and
        must stay private (ADR-0006 decision 5). Only user-service calls it,
        after deciding the scope. The body must name exactly one of `all` or
        `accountIds`, so "every transaction" is never a default.
      operationId: computeTransactionStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                all: { type: boolean, description: 'Every transaction, including unmatched ones.' }
                accountIds:
                  type: array
                  maxItems: 20000
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionStats' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The caller's Cognito access token, forwarded by dashboard-service. Needs the ADMIN or AGENT group.

  parameters:
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date }
      example: '2026-09-01'
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date }
      example: '2026-09-30'
    GroupBy:
      name: groupBy
      in: query
      description: '`agent` adds per-agent rows. Admins only: 403 for anyone else.'
      schema: { type: string, enum: [agent] }

  responses:
    BadRequest:
      description: A malformed window or parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid access token.
    Forbidden:
      description: The caller lacks a CRM role, or asked for per-agent figures without being an admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Amount:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '350.50'

    DailyCount:
      type: object
      required: [date, count]
      properties:
        date: { type: string, format: date }
        count: { type: integer, format: int64 }
        value:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: The day's amount, where the series has one and it is in one currency.

    ClientStats:
      type: object
      required: [total, byVerificationStatus, createdInWindow, dailyCreated]
      properties:
        total: { type: integer, format: int64, description: 'Clients in scope, whenever created.' }
        byVerificationStatus:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: The same clients by upper-cased status, e.g. VERIFIED, UNVERIFIED.
        createdInWindow: { type: integer, format: int64 }
        dailyCreated:
          type: array
          items: { $ref: '#/components/schemas/DailyCount' }
        byAgent:
          type: array
          description: Only with groupBy=agent.
          items:
            type: object
            required: [agentId, clientsOnboarded, verified, unverified]
            properties:
              agentId: { type: string, description: The agent's Cognito sub. }
              clientsOnboarded: { type: integer, format: int64 }
              verified: { type: integer, format: int64 }
              unverified: { type: integer, format: int64 }

    ClientActionItems:
      type: object
      required: [staleUnverified, staleUnverifiedTotal]
      properties:
        staleUnverified:
          type: array
          maxItems: 50
          items:
            type: object
            required: [clientId, firstName, lastName, createdAt]
            properties:
              clientId: { type: string, format: uuid }
              firstName: { type: string }
              lastName: { type: string }
              createdAt: { type: string, format: date-time }
        staleUnverifiedTotal: { type: integer, format: int64, description: 'All of them, not only the 50 listed.' }

    TeamComparison:
      type: object
      required: [days, from, to, clientsOnboarded, teamMedian, cohortSize]
      properties:
        days: { type: integer, enum: [7, 30, 90] }
        from: { type: string, format: date }
        to: { type: string, format: date, description: Today in Singapore. }
        clientsOnboarded: { type: integer, format: int64, description: The caller's own count. }
        teamMedian:
          type: number
          nullable: true
          description: The median across the group; null below 5 agents.
        cohortSize: { type: integer, format: int64 }

    AccountStats:
      type: object
      required: [total, byType, byStatus, byCurrency, byBranch, openedInWindow, bookedInitialDeposits, dailyOpened]
      properties:
        total: { type: integer, format: int64, description: 'Accounts in scope, whatever their opening date.' }
        byType: { type: object, additionalProperties: { type: integer, format: int64 } }
        byStatus: { type: object, additionalProperties: { type: integer, format: int64 } }
        byCurrency: { type: object, additionalProperties: { type: integer, format: int64 } }
        byBranch: { type: object, additionalProperties: { type: integer, format: int64 } }
        openedInWindow: { type: integer, format: int64 }
        bookedInitialDeposits:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Opening deposits of accounts opened in the window. Not a balance.
        currency: { type: string, description: Their currency; absent when none were opened. }
        dailyOpened:
          type: array
          items: { $ref: '#/components/schemas/DailyCount' }
        byAgent:
          type: array
          description: Only with groupBy=agent.
          items:
            type: object
            required: [agentId, accountsOpened, bookedInitialDeposits]
            properties:
              agentId: { type: string, description: The owner's Cognito sub. }
              accountsOpened: { type: integer, format: int64 }
              bookedInitialDeposits: { $ref: '#/components/schemas/Amount' }

    TransactionStats:
      type: object
      required: [total, byStatus, byType, currencies, daily, pendingBacklog]
      properties:
        total: { type: integer, format: int64 }
        byStatus: { type: object, additionalProperties: { type: integer, format: int64 }, description: 'Completed, Pending, Failed.' }
        byType: { type: object, additionalProperties: { type: integer, format: int64 }, description: 'Deposit, Withdrawal.' }
        currencies: { type: array, items: { type: string } }
        totalValue:
          allOf: [{ $ref: '#/components/schemas/Amount' }]
          description: Absent when the window's transactions span more than one currency.
        daily:
          type: array
          items: { $ref: '#/components/schemas/DailyCount' }
        pendingBacklog: { type: integer, format: int64, description: 'Still Pending more than 24 hours after their date, whatever the window.' }
        unmatched: { type: integer, format: int64, description: Linked to no account. Only in figures for every transaction. }
