# Known vulnerabilities the CI dependency scan accepts (ADR-0028). Every other
# known vulnerability in a dependency fails the build.
#
# Add an entry only for a vulnerability that cannot affect this system or
# that no release fixes, and say why. Each entry expires on ignoreUntil, when
# the build fails again until someone reviews it.

# spring-webmvc 6.2.19 is the last open-source Spring Framework 6.2 release
# (Spring Boot 3.5.16); these are fixed only in Spring Framework 7 (Boot 4).
[[IgnoredVulns]]
id = "GHSA-j9f9-w8pj-32f8"
ignoreUntil = 2027-01-31
reason = "Server-sent event fragment rendering: no service uses SseEmitter or fragment rendering. Fixed only in Spring Boot 4."

[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg"
ignoreUntil = 2027-01-31
reason = "XsltView path handling: no service uses XsltView. Fixed only in Spring Boot 4."

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-01-31
reason = "golang.org/x/crypto/openpgp is deprecated and no release fixes it; no service imports it (the other x/crypto packages are unaffected)."
