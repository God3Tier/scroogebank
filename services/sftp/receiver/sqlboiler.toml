output = "src/internal/repository/orm"
pkgname = "orm"
# No generated ORM tests: they need the PostgreSQL client tools (createdb,
# dropdb, pg_dump), which the Go test image lacks, and the repository tests
# already run the ORM against the real schema.
no-tests = true

[psql]
dbname = "transactions"
host = "db"
port = 5432
user = "crm"
pass = "crm"
sslmode = "disable"
schema = "public"
# The outbox is written with plain SQL (src/internal/repository/save_import.go), not the ORM.
blacklist = ["audit_outbox"]
