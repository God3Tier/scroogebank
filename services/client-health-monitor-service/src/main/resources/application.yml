server:
  port: ${SERVER_PORT:8087}

client-health:
  metrics:
    cloudwatch:
      enabled: ${CLIENT_HEALTH_CLOUDWATCH_METRICS_ENABLED:false}
      namespace: ${CLIENT_HEALTH_CLOUDWATCH_METRICS_NAMESPACE:Scrooge/ClientHealth}
      region: ${CLIENT_HEALTH_CLOUDWATCH_METRICS_REGION:ap-southeast-1}
      step: ${CLIENT_HEALTH_CLOUDWATCH_METRICS_STEP:1m}
  runtime:
    mode: ${CLIENT_HEALTH_MODE:API}
    lease-duration: ${CLIENT_HEALTH_ANALYSIS_LEASE_DURATION:60m}
  transaction-replay:
    endpoint: ${CLIENT_HEALTH_TRANSACTION_ENDPOINT:}
    token-uri: ${CLIENT_HEALTH_TRANSACTION_TOKEN_URI:}
    client-id: ${CLIENT_HEALTH_TRANSACTION_CLIENT_ID:}
    client-secret: ${CLIENT_HEALTH_TRANSACTION_CLIENT_SECRET:}
    scope: ${CLIENT_HEALTH_TRANSACTION_SCOPE:crm-transactions/read}
    connect-timeout: ${CLIENT_HEALTH_TRANSACTION_CONNECT_TIMEOUT:3s}
    read-timeout: ${CLIENT_HEALTH_TRANSACTION_READ_TIMEOUT:5s}
    page-size: ${CLIENT_HEALTH_TRANSACTION_PAGE_SIZE:100}
    maximum-pages: ${CLIENT_HEALTH_TRANSACTION_MAXIMUM_PAGES:100}
    maximum-rows: ${CLIENT_HEALTH_TRANSACTION_MAXIMUM_ROWS:50000}
  ai:
    enabled: ${CLIENT_HEALTH_AI_ENABLED:false}
    model-id: ${CLIENT_HEALTH_AI_MODEL_ID:}
    timeout: ${CLIENT_HEALTH_AI_TIMEOUT:5s}
    max-attempts: ${CLIENT_HEALTH_AI_MAX_ATTEMPTS:2}
    max-input-characters: ${CLIENT_HEALTH_AI_MAX_INPUT_CHARACTERS:6000}
    max-output-tokens: ${CLIENT_HEALTH_AI_MAX_OUTPUT_TOKENS:256}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
