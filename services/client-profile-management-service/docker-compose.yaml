services:
  postgres:
    image: postgres:16
    container_name: sqlboiler-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The auditor's messaging moved from Kafka to SQS (ADR-0004). Local SQS
  # is provided by the localstack service in compose.yaml, not here.

  # KMS and DynamoDB for client data encryption (ADR-0030). Port 4567, so it
  # can run beside the auditor's LocalStack on 4566. Keys live only as long as
  # this container: after a restart, clients created before it cannot be
  # read, so run make db-reset.
  localstack:
    image: localstack/localstack:3
    container_name: client-keys-localstack
    ports:
      - "4567:4566"
    environment:
      SERVICES: kms,dynamodb
      DEFAULT_REGION: ap-southeast-1
    volumes:
      - ./localstack/init-client-keys.sh:/etc/localstack/init/ready.d/init-client-keys.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
