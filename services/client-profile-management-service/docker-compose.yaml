services:
  postgres:
    image: postgres:16
    container_name: sqlboiler-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # The auditor's messaging moved from Kafka to SQS (ADR-0004). Local SQS
  # is provided by the localstack service in compose.yaml, not here.

volumes:
  pgdata:
