output = "models"
# Soft deletes (ADR-0036): generated queries skip rows whose deleted_at is set,
# and Delete(ctx, exec, false) sets deleted_at instead of removing the row.
add-soft-deletes = true

[psql]
dbname = "accounts"
host = "localhost"
port = 5436
user = "postgres"
pass = "postgres"
schema = "public"
sslmode = "disable"
# The audit outbox is written with plain SQL (src/serverd/sqs/outbox.go), not the ORM.
blacklist = ["audit_outbox"]
