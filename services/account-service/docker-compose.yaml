services:
  postgres:
    image: postgres:16
    container_name: account-service-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accounts
    ports:
      # 5432 is client-profile-management-service's database, 5433 its tests, 5434 user-service's and 5435 this service's tests.
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # Applies data/ with Flyway, from the image each task's db-migrate container
  # runs in AWS (docs/database/migrations.md). make run and make migrate run it.
  db-migrate:
    build:
      context: ../..
      dockerfile: infrastructure/db-migrate/Dockerfile
    image: crm/db-migrate:local
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/accounts
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
      FLYWAY_LOCATIONS: filesystem:/flyway/sql/accounts

  # The auditor's messaging moved from Kafka to SQS (ADR-0004). Local SQS
  # is provided by the localstack service in compose.yaml, not here.

volumes:
  pgdata:
