# Minimal mockery config for the event-alert-auditor-contract CI job: it only
# generates the audit.Repository mock that the queue consumer tests need. The
# full .mockery.yml also loads packages that need proto and ORM code CI does
# not generate.
dir: "{{.InterfaceDir}}"
filename: mocks.go
include-auto-generated: false
packages:
  auditor/src/internal/repository/audit:
    config:
      all: true
