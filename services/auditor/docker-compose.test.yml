services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5433:5432"
    healthcheck:
      # Over TCP: the image's first-start setup server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d myapp"]
      interval: 2s
      timeout: 5s
      retries: 3

  # S3 with Object Lock for the anchor tests (src/internal/repository/anchor).
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  tools:
    platform: linux/amd64
    build:
      context: .
      target: tools
    working_dir: /workspace
    volumes:
      - .:/workspace

  test-runner:
    image: golang:1.27.1-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./sqlboiler.docker.toml:/workspace/sqlboiler.toml:ro
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: myapp
      CHAIN_ANCHOR_TEST_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
