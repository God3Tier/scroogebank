services:
  postgres:
    image: postgres:16
    container_name: sqlboiler-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  # LocalStack stands in for AWS SQS locally. See ADR-0004 for why the
  # auditor moved from Kafka to SQS. init-queues.sh creates the
  # audit-insert / audit-insert-dlq queues on startup.
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"   # edge port for every LocalStack AWS API, including SQS
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    volumes:
      - ./services/auditor/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata: