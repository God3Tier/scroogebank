syntax = "proto3";
package proto;

option go_package = "/gen";
// Java clients (user-service) generate their stubs from this same file.
option java_package = "bank.audit.grpc";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message AuditLog {
	string event_type = 1;
	string action = 2;
	google.protobuf.Timestamp timestamp = 3;
	string payload = 4;
}

message GetAuditLogRequest {
	string service = 1;
}

message GetAuditLogResponse {
  repeated AuditLog logs = 1;
}

// One stored audit entry, with the fields needed to show who did what.
message AuditLogEntry {
	string id = 1;
	int64 sequence_no = 2;
	string event_type = 3;
	string action = 4;
	string source_service = 5;
	string actor_id = 6;
	google.protobuf.Timestamp timestamp = 7;
	string payload = 8;
}

// Every filter is optional; an empty or unset field means "any".
message ListAuditLogsRequest {
	string source_service = 1;
	string actor_id = 2;
	// Inclusive lower bound.
	google.protobuf.Timestamp from = 3;
	// Exclusive upper bound.
	google.protobuf.Timestamp to = 4;
	// 1 to 100.
	int32 page_size = 5;
	// Return entries older than this sequence number: the previous
	// response's next_before_sequence_no. 0 starts at the newest entry.
	int64 before_sequence_no = 6;
}

message ListAuditLogsResponse {
	// Newest first.
	repeated AuditLogEntry entries = 1;
	// Pass as before_sequence_no to get the next page. 0 means no more.
	int64 next_before_sequence_no = 2;
}

service AuditService{
	rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse);
	rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);
}
