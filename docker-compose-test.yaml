services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myapp"]
      interval: 2s
      timeout: 5s
      retries: 15

  tools:
    build:
      context: .
      dockerfile: services/client-profile-management-service/Dockerfile
      target: tools
    working_dir: /workspace/services/client-profile-management-service
    volumes:
      - .:/workspace

  test-runner:
    image: golang:1.27.1
    working_dir: /workspace/services/client-profile-management-service
    volumes:
      - .:/workspace
      - ./services/client-profile-management-service/sqlboiler.docker.toml:/workspace/services/client-profile-management-service/sqlboiler.docker.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
